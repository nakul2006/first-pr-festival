<!--
  SPIDER-ID CARD — Nanotech Suit Edition

  RULES
  1. Rename this file to <your-github-username>.html
  2. Internal CSS only.
  3. No <script> tags.
  4. Everything fits inside 320 x 440.
  5. Keep the four data- attributes on .spider-card.
-->

<div class="spider-card" data-name="Nakul Nandwana" data-alias="Yawning Pirate" data-github="nakul2006" data-suit="#E62429">

    <style>
        .spider-card {
            --suit: #e62429;
            --blue: #1677ff;
            --cyan: #00d9ff;
            --ink: #030407;
            --metal: #15191f;
            --text: #eef3f8;
            width: 320px;
            height: 440px;
            box-sizing: border-box;
            padding: 22px;
            position: relative;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            color: var(--text);
            background: radial-gradient( circle at 50% 25%, rgba(230, 36, 41, 0.22), transparent 35%), radial-gradient( circle at 100% 100%, rgba(0, 217, 255, 0.12), transparent 40%), linear-gradient( 145deg, #10141a 0%, #050609 45%, #010204 100%);
            border: 1px solid rgba(230, 36, 41, 0.8);
            border-radius: 20px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 0 35px rgba(230, 36, 41, 0.18), 0 20px 50px rgba(0, 0, 0, 0.7);
        }
        /* Nanotech grid */
        
        .spider-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient( rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient( 90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 18px 18px;
            pointer-events: none;
        }
        /* Red nanotech energy glow */
        
        .spider-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -100px;
            top: -90px;
            border-radius: 50%;
            background: var(--suit);
            opacity: 0.16;
            filter: blur(35px);
            pointer-events: none;
        }
        
        .top-line {
            position: absolute;
            top: 12px;
            left: 22px;
            right: 22px;
            height: 2px;
            background: linear-gradient( 90deg, transparent, var(--suit), var(--cyan), transparent);
            opacity: 0.8;
        }
        /* Spider emblem */
        
        .spider-logo {
            position: absolute;
            top: 19px;
            right: 20px;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--suit);
            font-size: 38px;
            line-height: 1;
            filter: drop-shadow(0 0 5px var(--suit)) drop-shadow(0 0 14px rgba(230, 36, 41, 0.6));
            transform: rotate(180deg);
        }
        
        .spider-logo::before {
            content: "🕷";
            filter: grayscale(1) brightness(1.7);
        }
        
        .status {
            position: absolute;
            top: 91px;
            right: 22px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: ui-monospace, monospace;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: #8dffb0;
            text-transform: uppercase;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #57ff87;
            box-shadow: 0 0 7px #57ff87, 0 0 14px rgba(87, 255, 135, 0.5);
        }
        
        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 16px;
            border: 1px solid rgba(230, 36, 41, 0.9);
            object-fit: cover;
            background: #080a0e;
            box-shadow: 0 0 0 3px rgba(230, 36, 41, 0.08), 0 0 22px rgba(230, 36, 41, 0.35), inset 0 0 20px rgba(0, 0, 0, 0.8);
        }
        
        .alias {
            margin: 14px 0 3px;
            font-size: 26px;
            line-height: 1.05;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(230, 36, 41, 0.4);
        }
        
        .alias::first-letter {
            color: var(--suit);
        }
        
        .name {
            margin: 0;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #b9c1ca;
        }
        
        .handle {
            margin-top: 5px;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            color: #66717d;
        }
        
        .handle::before {
            content: "@";
            color: var(--suit);
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 19px;
            padding: 0;
            list-style: none;
        }
        
        .skills li {
            position: relative;
            padding: 6px 11px;
            font-family: ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: 0.5px;
            color: #dfe7ef;
            border: 1px solid rgba(230, 36, 41, 0.55);
            border-radius: 6px;
            background: linear-gradient( 135deg, rgba(230, 36, 41, 0.15), rgba(255, 255, 255, 0.025));
            box-shadow: inset 0 0 10px rgba(230, 36, 41, 0.04);
        }
        
        .skills li::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 4px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--suit);
            box-shadow: 0 0 6px var(--suit);
        }
        
        .system {
            margin-top: 22px;
            padding: 12px;
            border-left: 2px solid var(--suit);
            background: linear-gradient( 90deg, rgba(230, 36, 41, 0.1), transparent);
        }
        
        .system-title {
            font-family: ui-monospace, monospace;
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--suit);
            text-transform: uppercase;
        }
        
        .system-value {
            margin-top: 5px;
            font-family: ui-monospace, monospace;
            font-size: 10px;
            color: #aab5c0;
        }
        
        .scan {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 57px;
            height: 1px;
            background: linear-gradient( 90deg, transparent, var(--cyan), transparent);
            opacity: 0.45;
        }
        
        .footer {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 18px;
            display: flex;
            justify-content: space-between;
            font-family: ui-monospace, monospace;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: #68727d;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
        }
        
        .footer span:first-child {
            color: var(--suit);
        }
    </style>

    <div class="top-line"></div>

    <div class="spider-logo"></div>

    <div class="status">
        <span class="status-dot"></span> SYSTEM ONLINE
    </div>

    <img class="avatar" src="https://github.com/nakul2006.png" alt="Nakul Nandwana" />

    <h1 class="alias">Yawning Pirate</h1>

    <p class="name">Nakul Nandwana</p>

    <p class="handle">nakul2006</p>

    <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>GIT</li>
    </ul>

    <div class="system">
        <div class="system-title">Nanotech Core</div>
        <div class="system-value">
            SPIDER-SUIT // ACTIVE
        </div>
    </div>

    <div class="scan"></div>

    <div class="footer">
        <span>Spider-Society</span>
        <span>Earth-1610</span>
    </div>

</div>
